# 本地联调：增加模拟模型服务 mock-llm（只用于开发，不进生产）。用法（在仓库根目录）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.mock.yml up -d --build
#   echo dummy-key | docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.mock.yml exec -T app \
#     python -m app.cli set-model --base-url http://mock-llm:9000/v1 --model mock-model --api-key-stdin
# 回复模式用环境变量 MOCK_LLM_MODE 切换（normal / fenced / non_json / bad_loc / fake_quote /
# missing_requirement / http_500 / timeout，见 backend/tests/mock_llm.py），改后重建 mock-llm 容器。
services:
  mock-llm:
    image: python:3.12.15-slim-trixie
    restart: unless-stopped
    command: ["python", "/srv/backend/tools/mock_llm_server.py"]
    environment:
      MOCK_LLM_MODE: ${MOCK_LLM_MODE:-normal}
    volumes:
      - ../backend/tools:/srv/backend/tools:ro
      - ../backend/tests/mock_llm.py:/srv/backend/tests/mock_llm.py:ro
    # 只在内部网络，不暴露端口
