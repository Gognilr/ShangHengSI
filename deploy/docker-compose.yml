# 4 个服务：db / app / worker / web（SPEC 4、20.2）。
# 用法：复制 .env.example 为 .env 并填写，准备 secrets/ 下的密钥文件，然后
#   docker compose up -d
name: aireview

x-backend: &backend
  image: aireview-backend:${APP_VERSION:-dev}
  build:
    context: ../backend
    target: runtime
  restart: unless-stopped
  environment: &backend-env
    DATABASE_URL: postgresql://aireview:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@db:5432/aireview
    APP_MASTER_KEY_FILE: /run/secrets/master_key
    BACKUP_PASSWORD_FILE: /run/secrets/backup_password
    FILES_DIR: /data/files
    BACKUP_DIR: /backup
    OCR_MODEL_DIR: /srv/backend/resources/ocr_models
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    TZ: Asia/Shanghai
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
    APP_VERSION: ${APP_VERSION:-dev}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: aireview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: aireview
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/postgresql/data
    # 只在内部网络，不暴露端口
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireview -d aireview"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *backend
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    volumes:
      - files_data:/data/files
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    volumes:
      - files_data:/data/files
      - ${BACKUP_HOST_DIR:-./backup}:/backup
      - ./secrets:/run/secrets:ro
    depends_on:
      app:
        # 等 app 完成数据库迁移后再启动
        condition: service_healthy

  web:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  files_data:
  caddy_data:
  caddy_config:
