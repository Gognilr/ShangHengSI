# 主线五个服务，转写容器通过 asr profile 启用。
# 用法：复制 .env.example 为 .env 并填写，准备 secrets/ 下的密钥文件，然后
#   docker compose up -d
name: aireview

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-backend: &backend
  image: aireview-backend:${APP_VERSION:-dev}
  restart: unless-stopped
  environment: &backend-env
    DATABASE_URL: postgresql://aireview:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@db:5432/aireview
    APP_MASTER_KEY_FILE: /run/secrets/master_key
    BACKUP_PASSWORD_FILE: /run/secrets/backup_password
    FILES_DIR: /data/files
    BACKUP_DIR: /backup
    OCR_MODEL_DIR: /usr/local/lib/python3.12/site-packages/rapidocr_onnxruntime/models
    LOCAL_MODELS_FILE: /etc/aireview/models.yaml
    COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    CONVERT_SPOOL_DIR: /spool
    TMPDIR: /spool
    TZ: Asia/Shanghai
    MAX_AUDIO_MB: ${MAX_AUDIO_MB:-500}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
    APP_VERSION: ${APP_VERSION:-dev}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: aireview-db:${APP_VERSION:-dev}
    # build-begin
    build:
      context: ./db
    # build-end
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: aireview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: aireview
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/postgresql/data
    # 只在内部网络，不暴露端口
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireview -d aireview"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *backend
    logging: *logging
    # build-begin
    build:
      context: ../backend
      target: runtime
    # build-end
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log
    volumes:
      - ./models.yaml:/etc/aireview/models.yaml:ro
      - ../transcriber/models/asr/MANIFEST.sha256:/etc/aireview/model-manifests/asr.sha256:ro
      - files_data:/data/files
      - ./secrets:/run/secrets:ro
      - convert_spool:/spool
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    logging: *logging
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      NER_THREADS: ${NER_THREADS:-8}
      EMBED_THREADS: ${EMBED_THREADS:-8}
      WORKER_REVIEW_CONCURRENCY: ${WORKER_REVIEW_CONCURRENCY:-8}
      WORKER_PARSE_CONCURRENCY: ${WORKER_PARSE_CONCURRENCY:-2}
      WORKER_TRANSCRIBE_CONCURRENCY: ${WORKER_TRANSCRIBE_CONCURRENCY:-1}
      CONVERT_SPOOL_DIR: /spool
      LAWSYNC_PROXY: ${LAWSYNC_PROXY:-}
    volumes:
      - ./models.yaml:/etc/aireview/models.yaml:ro
      - ../transcriber/models/asr/MANIFEST.sha256:/etc/aireview/model-manifests/asr.sha256:ro
      - files_data:/data/files
      - ${BACKUP_HOST_DIR:-./backup}:/backup
      - ./secrets:/run/secrets:ro
      - convert_spool:/spool
    depends_on:
      app:
        # 等 app 完成数据库迁移后再启动
        condition: service_healthy

  # 旧格式转换（SPEC 8.8，design/R2.md 3.2）：不接任何网络，只通过内存盘 /spool 与 worker 交换文件。
  # 不挂载原件卷、密钥和备份目录，不连数据库；不设 depends_on（worker 按心跳判断是否可用）。
  converter:
    image: aireview-converter:${APP_VERSION:-dev}
    logging: *logging
    # build-begin
    build:
      context: ../converter
    # build-end
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "10002:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=256m,mode=1777  # LibreOffice 的临时配置目录
    environment:
      CONVERT_SPOOL_DIR: /spool
    volumes:
      - convert_spool:/spool
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    healthcheck:
      # 心跳文件 30 秒内更新过
      test: ["CMD", "python", "/srv/converter/main.py", "--check"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 转写与主线独立，只通过共享内存盘交换文件。
  transcriber:
    image: aireview-transcriber:${APP_VERSION:-dev}
    # build-begin
    build:
      context: ../transcriber
      target: runtime
    # build-end
    profiles: [asr]
    logging: *logging
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "10003:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    environment:
      CONVERT_SPOOL_DIR: /spool
      ASR_THREADS: ${ASR_THREADS:-8}
      ASR_MEM: ${ASR_MEM:-4g}
    volumes: [convert_spool:/spool]
    mem_limit: ${ASR_MEM:-4g}
    cpus: ${ASR_CPUS:-8}
    cpu_shares: 256
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "/srv/transcriber/main.py", "--check"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    image: aireview-web:${APP_VERSION:-dev}
    logging: *logging
    # build-begin
    build:
      context: ../frontend
    # build-end
    restart: unless-stopped
    command: ["/bin/sh", "/etc/caddy/fragments/start.sh"]
    environment:
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:-500}
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/fragments:ro
      - ./secrets/ca:/run/site-ca:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  files_data:
  caddy_data:
  caddy_config:
  # 内存盘（tmpfs），只在 worker 与 converter 之间交换待转换的旧格式文件，不落盘
  convert_spool:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=2g,uid=10001,gid=10001,mode=0770
