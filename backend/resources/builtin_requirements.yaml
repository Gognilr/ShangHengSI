  - {id: "G-03", doc_types: ["all"], stances: ["all"], sources: ["all"], dimension: "逻辑", text: "条款之间相互矛盾；同一事项的数值、日期、单位、币种前后不一致"}
  - {id: "G-04", doc_types: ["all"], stances: ["all"], sources: ["all"], dimension: "逻辑", text: "引用的条款编号、附件、定义是否存在且一致"}
  - {id: "G-05", doc_types: ["all"], stances: ["all"], sources: ["all"], dimension: "法律", text: "签署主体、履约主体、收付款主体是否一致（按代号判断）；授权与签署要求是否明确"}
  - {id: "G-06", doc_types: ["all"], stances: ["all"], sources: ["all"], dimension: "合规与制裁", text: "交易对象性质（如军方、军工单位、受限政府机构）、目的地及转运迹象（如买方与收货人不在同一国家、由货代收货）、最终用途描述，是否存在制裁或出口管制风险；交易各方均为境内主体、货物不出境且不涉及出口管制物项时判不适用"}
  - {id: "G-07", doc_types: ["all"], stances: ["all"], sources: ["all"], dimension: "合规与制裁", text: "是否出现可能被视为规避制裁或出口管制的表述，如安排第三国转运、品名或原产地描述不实、拆分发货、要求特殊标识；不涉及进出口时判不适用"}
  - {id: "G-08", doc_types: ["all"], stances: ["all"], sources: ["all"], dimension: "合规与制裁", text: "跨境付款的路径与币种风险，如由第三方付款、经受限银行付款；不涉及跨境付款时判不适用"}
  - {id: "G-09", doc_types: ["all"], stances: ["all"], sources: ["all"], dimension: "合规与制裁", text: "产品是否可能属于中国出口管制物项、是否需要出口许可（结合公司说明；最新规定以合规人员确认为准）；货物不出境且无出口迹象时判不适用"}
