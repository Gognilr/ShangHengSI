  - {id: "G-11", doc_types: ["all"], stances: ["all"], sources: ["outgoing"], dimension: "商务", text: "是否作出超出我方能力或无条件的承诺"}
  - {id: "G-12", doc_types: ["all"], stances: ["all"], sources: ["incoming"], dimension: "商务", text: "对我方不利或异常的条款与要求"}
  # ---------- 12.2 合同（contract） ----------
  - {id: "C-01", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "商务", text: "价格条款是否明确：是否含税及适用税率、币种、价格调整机制；跨境交易还看贸易术语"}
  - {id: "C-02", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "商务", text: "付款方式、节点、比例、期限是否明确，对我方是否安全"}
