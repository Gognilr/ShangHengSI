  - {id: "C-07", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "法律", text: "解除与终止条件；是否存在对方单方解除权"}
  - {id: "C-08", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "法律", text: "不可抗力条款是否完整合理"}
  - {id: "C-09", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "法律", text: "争议解决方式和适用法律是否明确；仲裁机构或管辖法院是否明确有效"}
  - {id: "C-10", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "法律", text: "保密条款；知识产权的归属与许可范围（含定制开发成果、软件源代码、技术资料与数据），我方交付后的使用、修改与转让权利"}
  - {id: "C-11", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "法律", text: "生效条件、份数、语言版本冲突时以何为准"}
  - {id: "C-12", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "合规与制裁", text: "涉及境外主体、进出口或出口管制物项时：是否有出口管制与制裁合规条款、最终用户声明、禁止转售条款，相关条款对我方是否过苛；不涉及时判不适用"}
  - {id: "C-13", doc_types: ["contract"], stances: ["sales"], sources: ["all"], dimension: "商务", text: "回款保障；对方单方扣款或抵扣权；过高的质量保证或赔偿责任；验收条件是否不合理"}
  - {id: "C-14", doc_types: ["contract"], stances: ["purchase"], sources: ["all"], dimension: "商务", text: "供应商质量保证与退换货；延迟交付违约金及其上限；预付款风险与担保；供应商免责条款"}
  - {id: "C-15", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "商务", text: "质保期的起算点与期限、质保金比例与退还条件、保修响应时限与费用承担"}
  - {id: "C-16", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "商务", text: "发票类型（增值税专用发票或普通发票）、税率与开票时点，开票与付款节点的先后（如先票后款）；税率是否与现行规定一致需人工确认"}
  - {id: "C-17", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "商务", text: "验收标准、程序与期限是否明确；“视为验收合格”的条件；验收与付款、质保起算的关系"}
  - {id: "C-18", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "法律", text: "是否允许分包或转包、是否须经我方书面同意；关键人员更换与履约资质要求"}
  - {id: "C-19", doc_types: ["contract"], stances: ["all"], sources: ["all"], dimension: "法律", text: "涉及现场施工、安装或驻场服务时，安全生产、现场管理与人身财产损害责任的划分；不涉及时判不适用"}
