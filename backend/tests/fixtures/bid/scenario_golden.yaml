# V34-B-07 整套虚构场景的 golden 标注（bid.md 第六节）。投标人按录入顺序记为 0 甲、1 乙、2 丙：
# 甲 = 虚构松青仪器，乙 = 虚构鳞木科技，丙 = 虚构赭石设备。
# 每行：kind type level bidders。条目集合必须与此完全一致，多出或缺少都要先弄清原因再改本文件。

scenario:
  # 预埋线索
  - {kind: clue, type: contact, level: strong, bidders: [0, 1]}    # 共用电话与项目经理
  - {kind: clue, type: mixed, level: strong, bidders: [0, 2]}      # 丙的文件里出现甲的名称
  - {kind: clue, type: props, level: strong, bidders: [0, 1]}      # 两份 Word 作者相同（招标文件中的 rsid 已剔除）
  - {kind: clue, type: props, level: strong, bidders: [1, 2]}      # 两份 PDF 原始文件标识相同
  - {kind: clue, type: pricing, level: strong, bidders: [0, 1]}    # 分项单价比值恒定 1.03
  - {kind: clue, type: similar, level: strong, bidders: [0, 1]}    # 共用自写的售后服务方案
  - {kind: clue, type: image, level: medium, bidders: [0, 1]}      # 授权委托书页同一张图片
  # 预埋的确定性问题（V35-E-01 起不再比对最高限价、保证金与投标有效期）
  - {kind: issue, type: multi_total, level: veto, bidders: [2]}    # 两个不同总价
  - {kind: issue, type: uppercase, level: general, bidders: [1]}   # 大小写金额不一致
  - {kind: issue, type: cert_expired, level: general, bidders: [2]}  # 证书已过期
  # 样本自带的弱项：甲丙的 PDF 都由同一软件在同一时刻生成，按“生成软件相同且创建时间 10 分钟内”报弱线索
  - {kind: clue, type: props, level: weak, bidders: [0, 2]}

# 必须不出现：招标文件里就有的内容（招标代理电话、rsid、标识图片、否决句、格式页）不得被当成线索
absent:
  - {kind: clue, type: contact, bidders: [0, 2]}
  - {kind: clue, type: contact, bidders: [1, 2]}
  - {kind: clue, type: image, bidders: [0, 2]}
  - {kind: clue, type: image, bidders: [1, 2]}
  - {kind: clue, type: similar, bidders: [0, 2]}
  - {kind: clue, type: similar, bidders: [1, 2]}
  - {kind: issue, type: cert_expired, bidders: [0]}  # 历史证书过期、同类现行证书有效（V35-E-02）
  - {kind: issue, type: ceiling, bidders: [0]}
  - {kind: issue, type: ceiling, bidders: [1]}
