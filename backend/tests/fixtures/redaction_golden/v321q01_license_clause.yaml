description: V321Q-01：“许可证”后面的条款叙述不是编号——全角逗号折成半角后不再被当成取值，中文数字“三日”“第三方”不算编号里的数字；带冒号或“编号”的证照号照常替换
stance: purchase
must_replace:
  - {text: 澜川新材料科技有限公司, category: ORG}
  - {text: 鼎晟化工贸易有限公司, category: ORG}
  - {text: '苏(宁)危化经字[2023]00123', category: IDNO}
  - {text: '粤WH安许证字[2024]00321', category: IDNO}
must_keep:
  - 并在合同签订后三日内提供复印件
  - 有效期不少于一年
  - 排污许可证有效期不少于3年
  - 乙方保证其使用不侵犯第三方权利
  - 有效期至2027年
returns:
  - field: clause
    model: "开源组件应列明名称、版本和许可证，乙方保证其使用不侵犯第三方权利且不要求甲方开源自有代码。"
    expect: "开源组件应列明名称、版本和许可证，乙方保证其使用不侵犯第三方权利且不要求甲方开源自有代码。"
    marks: []
