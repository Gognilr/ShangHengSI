description: V35-E-02 问题 13：合同角色词（买受人、出卖人、委托人、受托人）及其子串不作为人名或单位；“公司”前取名称时左边界不越过角色词与“日内”等虚词
stance: purchase
must_replace:
  - {text: 青岚虚构泵业有限公司, category: ORG}
  - {text: 远山虚构机械制造有限公司, category: ORG}
  - {text: 郗珩, category: PERSON}
must_keep:
  - 出卖人应于发货后三日内将发票寄送买受人
  - 买受人收到发票后十日内付款
  - 发票由出卖人或其委托者三日内寄达买受人公司财务部
  - 逾期视为买受人已收到
  - 委托人与受托人另行约定的
  - 受托人不得转委托
