description: 技术文件同类误识别（V33-C-03 举一反三）：短代号、标准代号 TSG、工控缩写、设备名“××门 / ××云”、角色“××顾问 / ××工”、“接受电厂”、部门名称、“施工队长”不替换不列；“联系人：方圆”仍按人名替换，叙述人名仍列出
stance: purchase
must_replace:
  - {text: 青岚虚构化工有限公司, category: ORG}
  - {text: 远川虚构环保工程有限公司, category: ORG}
  - {text: 方圆, category: PERSON}
must_keep:
  - 输出4-20mA信号至PLC
  - 三路信号OA、OB、OZ，阀体材质WCB
  - 压力容器按TSG 21-2016设计制造，电机为TEFC结构，带HART协议
  - 开机前检查主汽门及调速汽门，系统部署在甲方私有云
  - 实施顾问两名，并配备持证起重工
  - 并接受电厂运行人员的监督
  - 负责人：设备部
  - 联系人：施工队长
  - 由甲方安环部进行三级安全教育
must_suspect:
  - 王师傅
