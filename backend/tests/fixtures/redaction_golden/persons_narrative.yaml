description: 叙述中的中文人名（R4-08，设计 R4.md 第十一节）：“联系人为 / 对接人是”等角色词之后、“提到 / 表示 / 说”等动作词和“女士 / 经理”等称谓之前的“姓氏 + 1–2 字”列为疑似遗漏（实现后按 11.6 追加 must_suspect）；带冒号标签的人名仍自动替换；“王总”“李经理”、以姓氏字开头的普通词（周期、常规、项目、方案、文件、黄金、高于）和“我们周五前”不列
stance: sales
must_replace:
  - {text: 周示例, category: PERSON}
  - {text: 王总, category: PERSON}
  - {text: 李经理, category: PERSON}
  - {text: 赵总监, category: PERSON}
  - {text: 宋虚婷, category: PERSON}
must_keep:
  - 业务往来备忘
  - 提到的条款需要复核
  - 都同意了
  - 周期表示为 30 天
  - 常规要求见第三条
  - 我们周五前回复
  - 本合同项目名称为虚构工程，方案说明见附件
  - 文件说明见附件二
  - 双方同意按本合同执行，任何一方提出异议应书面通知
  - 由于对方要求提前交货，交期另行协商
  - 黄金价格表示上涨
  - 高于市场价格的部分由买方承担
must_suspect:
  - 陆虚岚
  - 欧阳虚明
  - 何虚芳
  - 林虚
