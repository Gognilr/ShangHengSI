description: 销售合同（中英文混合）：签约方信息块、简称、统一社会信用代码、电话、邮箱、账号、SWIFT、合同号、金额与大写金额、联系人、地址；未识别的英文机构名列为疑似遗漏
stance: sales
must_replace:
  - {text: 北辰虚构新材料有限公司, category: ORG}
  - {text: 北辰公司, category: ORG}
  - {text: Orion Fictive Trading L.L.C., category: ORG}
  - {text: Fictive Commercial Bank Ltd., category: ORG}
  - {text: SC-2026-0417, category: REFNO}
  - {text: 91110000MA01XYQABC, category: IDNO}
  - {text: "13900001234", category: PHONE}
  - {text: 010-87654321, category: PHONE}
  - {text: +971 4 555 0123, category: PHONE}
  - {text: sales@beichen-example.com, category: EMAIL}
  - {text: 6222 0000 1111 2222 333, category: ACCOUNT}
  - {text: FCBKCNBJ300, category: SWIFT}
  - {text: "1,250.00", category: PRICE}
  - {text: "625,000.00", category: AMOUNT}
  - {text: "187,500.00", category: AMOUNT}
  - {text: "4,500,000.00", category: AMOUNT}
  - {text: 肆佰伍拾万元整, category: AMOUNT}
  - {text: 陈示例, category: PERSON}
  - {text: Layla Example, category: PERSON}
  - {text: "Office 405, Fictive Tower, Business Bay, Dubai, United Arab Emirates", category: ADDR}
  - {text: 北京市朝阳区示例大街 18 号院 3 号楼, category: ADDR}
must_suspect:
  - Meridian Fictive Inspection
must_keep:
  - 针状石油焦
  - "27131100"
  - 硫含量≤0.6%
  - 灰分≤0.2%
  - 6-25mm
  - 500 MT
  - ±5%
  - USD
  - FOB Qingdao Port
  - 青岛港
  - Jebel Ali Port
  - 2026年6月30日
  - 2026年4月17日
  - 30 天
  - 30%
  - 0.5%
  - 最高不超过 5%
  - 检验费用由卖方承担
  - 适用中华人民共和国法律
returns:
  - field: text
    model: "[客户_A]与[我方]核对[金额_1]。"
    expect: "Orion Fictive Trading L.L.C.与北辰虚构新材料有限公司核对625,000.00。"
    marks: []
    restored: 3
    fixed: 0
  - field: clause
    model: "[ Customer A 】向客户＿Ａ付款[金额_2]（=合同总价的 30.0%）。"
    expect: "Orion Fictive Trading L.L.C.向Orion Fictive Trading L.L.C.付款187,500.00。"
    marks: []
    restored: 3
    fixed: 2
    removed: 1
  - field: text
    model: "客户A、客户 A、Customer A、人员1、Person 1。"
    expect: "客户A、客户 A、Customer A、人员1、Person 1。"
    marks: [{raw: 客户A, kind: variant}, {raw: 客户 A, kind: variant}, {raw: Customer A, kind: variant}]
  - field: clause
    model: "人员1、Person 1、[客户_C]、客户_C、[金额_9]。"
    expect: "人员1、Person 1、[客户_C]、客户_C、[金额_9]。"
    marks: [{raw: 人员1, kind: variant}, {raw: Person 1, kind: variant}, {raw: "[客户_C]", kind: unknown}, {raw: 客户_C, kind: unknown}, {raw: "[金额_9]", kind: unknown}]
  - field: text
    model: "见[F1-P3]、F2-PG3-B5和F1-S1-E8；AF1-P3、F1-P3-X不算位置。"
    expect: "见合同 第三条、F2-PG3-B5和F1-S1-E8；AF1-P3、F1-P3-X不算位置。"
    locations: {F1-P3: 合同 第三条}
    marks: [{raw: F2-PG3-B5, kind: note}, {raw: F1-S1-E8, kind: note}]
