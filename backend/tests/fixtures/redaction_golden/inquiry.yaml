description: 中英文混合询价函：买方与供应商、目标单价、联系方式、询价编号、联系人、地址
stance: purchase
must_replace:
  - {text: 万象虚构贸易有限公司, category: ORG}
  - {text: Lumen Placeholder Chemicals Inc., category: ORG}
  - {text: "700", category: PRICE}
  - {text: +86 21 6000 1234, category: PHONE}
  - {text: purchase@wanxiang-example.com, category: EMAIL}
  - {text: RFQ-2026-0715, category: REFNO}
  - {text: 刘示例, category: PERSON}
  - {text: "88 Example Road, Pune, India", category: ADDR}
must_suspect:
  - Harbor Fictive Labs
must_keep:
  - 煅后石油焦
  - Calcined Petroleum Coke
  - Sulfur ≤0.7%
  - Volatile matter ≤0.5%
  - Size 0-3mm
  - 1,000 MT per month
  - 12 months
  - USD
  - CFR Mumbai
  - Mumbai, India
  - August 2026
  - 2026年7月20日
  - 不少于 30 天
returns:
  - field: text
    model: "Supplier_A, [Supplier A], [供应商Ａ]。"
    expect: "Lumen Placeholder Chemicals Inc., Lumen Placeholder Chemicals Inc., Lumen Placeholder Chemicals Inc.。"
    marks: []
    restored: 3
    fixed: 3
  - field: text
    model: "Person_1, 编号_1, Price_1。"
    expect: "刘示例, RFQ-2026-0715, 700。"
    marks: []
    restored: 3
    fixed: 2
  - field: clause
    model: "供应商B、人员9、编号9、Customer_B。"
    expect: "供应商B、人员9、编号9、Customer_B。"
    marks: [{raw: Customer_B, kind: unknown}]
  - field: text
    model: "F1-P3【主体说明】"
    expect: "F1-P3【主体说明】"
    marks: [{raw: F1-P3, kind: note}]
  - field: text
    model: "供应商_AB、人员_12、XPerson_1、人员_1ABC。"
    expect: "供应商_AB、人员_12、XPerson_1、人员_1ABC。"
    marks: [{raw: 供应商_AB, kind: unknown}, {raw: 人员_12, kind: unknown}]
