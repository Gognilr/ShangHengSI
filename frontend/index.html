<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // 外观设置（V31-U1 3.3）：样式生效前先写外壳与特效，避免首屏闪烁；之后由 stores/appearance.ts 接管
      (function () {
        var shell = 'night', fx = 'auto'
        try {
          var v = JSON.parse(localStorage.getItem('si.appearance') || '{}')
          if (v.shell === 'light') shell = 'light'
          if (v.fx === 'full' || v.fx === 'lite' || v.fx === 'off') fx = v.fx
        } catch (e) {}
        if (fx === 'auto') fx = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'full'
        document.documentElement.dataset.shell = shell
        document.documentElement.dataset.fx = fx
      })()
    </script>
    <title>商衡SI · 企业安全脱敏与智能审查平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
