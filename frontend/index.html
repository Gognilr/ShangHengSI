<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // 外观设置（V31-U1 3.3）：样式生效前先写外壳与特效，避免首屏闪烁；之后由 stores/appearance.ts 接管
      (function () {
        var shell = 'light', fx = 'auto'
        try {
          var v = JSON.parse(localStorage.getItem('si.appearance') || '{}')
          if (v.shell === 'night') shell = 'night'
          if (v.fx === 'full' || v.fx === 'lite' || v.fx === 'off') fx = v.fx
        } catch (e) {}
        if (fx === 'auto') fx = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'full'
        document.documentElement.dataset.shell = shell
        document.documentElement.dataset.fx = fx
      })()
    </script>
    <title>商衡SI · 企业安全脱敏与智能审查平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 浏览器过旧（如 Windows 7 的 Chrome 75）时脚本会语法报错而白屏：先给出提示（V31Q-117，构建目标约为 Chromium 107）
      (function () {
        if (typeof Array.prototype.findLast === 'function' && typeof structuredClone === 'function') return
        document.getElementById('app').innerHTML = '<p style="margin:48px auto;max-width:520px;font-size:16px;line-height:1.8">'
          + '当前浏览器版本过低，无法使用商衡SI。<br>请在 Windows 10 / 11 上用最新版 Microsoft Edge 打开本页面。</p>'
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
